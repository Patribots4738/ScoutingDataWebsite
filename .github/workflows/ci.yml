name: Node.js CI

on:
    workflow_dispatch:
    push:
        branches: [$default-branch]
    pull_request:
        branches: [$default-branch]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: 26.x
                  cache: "pnpm"
            - name: Install packages
              run: pnpm ci
            - name: Lint code
              run: pnpm lint
              continue-on-error: true
            - name: Build project
              run: pnpm run build
